  image:
  link: https://github.com/Enzo-Claeyssen/jeux_iteres_part1
  description: Stage de recherche au sein de l'équipe SMAC du laboratoire Cristal de Lille. A été effectué, une introduction à l'apprentissage par renforcement, à l'utilisation de gymnasium, stable baselines3, rllib, comparaison entre le QLearning et DQN sur 3 problèmes. Démonstration du fonctionnement du QLearning, et travail sur un jeu itéré à 2 joueurs.

